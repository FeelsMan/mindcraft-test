name: Managed goal regressions

on:
  push:
    branches:
      - develop
      - mia/grounded-crafting-2026-10-17
      - mia/windows-memory-cleanup-2026-10-17
      - mia/nearby-interactions-2026-10-18
      - mia/shelter-builder-2026-10-18
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'profiles/defaults/**'
      - 'scripts/**'
      - 'patches/**'
      - 'vendor/**'
      - 'package.json'
      - '.github/workflows/managed-goals.yml'

permissions:
  contents: read

concurrency:
  group: managed-goals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libxi-dev libxext-dev libx11-dev mesa-common-dev libgl1-mesa-dev
      - name: Install the pinned Minecraft runtime
        run: npm install --legacy-peer-deps
      - name: Managed goal regressions
        run: npm run test:goals

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Installer backup and rollback regressions
        run: node --test test/crafting-installer.test.cjs
      - name: Package the verified installer
        uses: actions/upload-artifact@v4
        with:
          name: mia-crafting-reliability-fix
          path: scripts/mia-crafting-reliability-fix.cjs
          if-no-files-found: error
          retention-days: 30

  windows-memory:
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install the memory tests' only external dependency
        run: |
          $deps = Join-Path $env:RUNNER_TEMP "mia-memory-test-deps"
          npm install --prefix $deps --ignore-scripts --no-audit --no-fund --package-lock=false vec3@0.1.10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force node_modules | Out-Null
          Copy-Item -Recurse -Path (Join-Path $deps "node_modules/vec3") -Destination "node_modules/vec3"
      - name: SQLite memory regressions on Windows
        run: node --test test/local-memory.test.js

  windows-interactions:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install interaction test dependencies without native viewer builds
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Nearby block interaction regressions on Windows
        run: |
          node scripts/install-native-minecraft.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-test-module-mocks --test test/mining-navigation.test.js test/station-access.test.js test/crafting-results.test.js test/shelter-builder.test.js test/shelter-commands.test.js
